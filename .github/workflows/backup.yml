# Nightly database backups for every client shop.
#
# Setup (once): Settings → Secrets and variables → Actions → New repository secret
#   Name:  BACKUP_DATABASE_URLS
#   Value: one line per shop: "<name> <postgres connection string>", e.g.
#          margarita postgresql://postgres.abcd:PASSWORD@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
#   Use the Supabase "Session pooler" string (port 5432), not the transaction pooler.
#
# Backups are kept as workflow artifacts for 30 days (Actions → Nightly backups → a run → Artifacts).
# Keep this repository PRIVATE: artifacts contain customer data.
name: Nightly backups

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC every night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump databases
        env:
          BACKUP_DATABASE_URLS: ${{ secrets.BACKUP_DATABASE_URLS }}
        run: |
          set -euo pipefail
          mkdir -p backups
          failed=0
          while read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            echo "Backing up $name"
            if /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges --schema=public --format=custom \
                 --file "backups/${name}-$(date -u +%F).dump" "$url"; then
              echo "  ok"
            else
              echo "::error::Backup failed for $name"; failed=1
            fi
          done <<< "$BACKUP_DATABASE_URLS"
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-backups-${{ github.run_id }}
          path: backups/
          retention-days: 30
